---
- name: Check if cluster is already initialised
  ansible.builtin.stat:
    path: /etc/kubernetes/admin.conf
  register: kubeadm_init_done

- name: Run kubeadm init
  ansible.builtin.command:
    cmd: >
      kubeadm init
      --apiserver-cert-extra-sans={{ subdomain }}.{{ domain }}
  when: not kubeadm_init_done.stat.exists
  register: kubeadm_init_output

- name: Create .kube directory for root
  ansible.builtin.file:
    path: /root/.kube
    state: directory
    mode: "0700"

- name: Copy admin kubeconfig for root
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: /root/.kube/config
    remote_src: true
    mode: "0600"

- name: Create .kube directory for ansible user
  ansible.builtin.file:
    path: "/home/{{ ansible_user }}/.kube"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0700"

- name: Copy admin kubeconfig for ansible user
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: "/home/{{ ansible_user }}/.kube/config"
    remote_src: true
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0600"

- name: Untaint control-plane node
  ansible.builtin.command:
    cmd: kubectl taint nodes --all node-role.kubernetes.io/control-plane-
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  when: not kubeadm_init_done.stat.exists
  # Ignore error if taint is already absent
  failed_when: false

- name: Fetch kubeconfig to local machine
  ansible.builtin.fetch:
    src: /etc/kubernetes/admin.conf
    dest: "{{ kubeconfig_local_path }}"
    flat: true

- name: Update kubeconfig server to FQDN
  ansible.builtin.command:
    cmd: kubectl config set-cluster kubernetes --server=https://{{ subdomain }}.{{ domain }}:6443
  delegate_to: localhost
  become: false
  changed_when: true
