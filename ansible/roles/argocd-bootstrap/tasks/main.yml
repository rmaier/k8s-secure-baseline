---
- name: Add ArgoCD Helm repo
  ansible.builtin.command:
    cmd: helm repo add argo https://argoproj.github.io/argo-helm
  changed_when: false

- name: Update Helm repos
  ansible.builtin.command:
    cmd: helm repo update
  changed_when: false

- name: Create argocd namespace
  ansible.builtin.shell:
    cmd: kubectl get namespace argocd || kubectl create namespace argocd
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  changed_when: false

- name: Install or upgrade ArgoCD
  ansible.builtin.command:
    cmd: >
      helm upgrade --install argocd argo/argo-cd
      --version {{ argocd_chart_version }}
      --namespace argocd
      --wait
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: argocd_result
  changed_when: "'has been installed' in argocd_result.stdout or 'has been upgraded' in argocd_result.stdout"

- name: Template root ArgoCD Application manifest
  ansible.builtin.template:
    src: argocd-root-app.yaml.j2
    dest: /tmp/argocd-root-app.yaml
    mode: "0600"

- name: Apply root ArgoCD Application (app-of-apps)
  ansible.builtin.command:
    cmd: kubectl apply -f /tmp/argocd-root-app.yaml
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  changed_when: false
